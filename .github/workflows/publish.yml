# Runs in the public Audryo/Skills repository, which the monorepo mirrors
# from packages/audryo. A v* tag publishes to npm through npm Trusted
# Publishing (OIDC, no token) with provenance, then updates the MCP Registry.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Tag matches every version field
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for file in package.json .claude-plugin/plugin.json server.json; do
            version=$(node -p "require('./$file').version")
            [ "$version" = "$tag" ] || { echo "$file has $version, tag is $tag"; exit 1; }
          done
      - run: npm test
      - run: npm publish --provenance --access public

  mcp-registry:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
